---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-deck-sync
  namespace: kong
  labels:
    app: kong
    component: deck-sync

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kong-deck-sync
  namespace: kong
  labels:
    app: kong
    component: deck-sync
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-deck-sync
  namespace: kong
  labels:
    app: kong
    component: deck-sync
subjects:
- kind: ServiceAccount
  name: kong-deck-sync
  namespace: kong
roleRef:
  kind: Role
  name: kong-deck-sync
  apiGroup: rbac.authorization.k8s.io
